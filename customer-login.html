<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - WolfBite Bistro</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Customer Login</h1>
                <p>Welcome back to WolfBite Bistro</p>
            </div>
            
            <form id="customerLoginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="auth-btn">Login</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="customer-signup.html">Sign up here</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
            
            <div class="separator">
                <span>Staff & Admin</span>
            </div>
            
            <div class="alternative-logins">
                <a href="staff-login.html" class="alt-login-btn staff">Staff Login</a>
                <a href="admin-login.html" class="alt-login-btn admin">Admin Login</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
